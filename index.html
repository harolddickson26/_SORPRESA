<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños, Mi Amor! 🎂🌌</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #020208;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* Canvas 3D de fondo */
        #galaxy-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Capa de contenido por encima */
        .content {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            background: radial-gradient(circle, transparent 40%, rgba(2, 2, 8, 0.85) 90%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(138, 43, 226, 0.3);
            margin-bottom: 20px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2.2rem;
            background: linear-gradient(45deg, #ff71ce, #ffe600, #05ffa1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255, 113, 206, 0.4);
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #d1d5db;
            margin-bottom: 20px;
        }

        .subtext {
            font-size: 1.05rem;
            color: #ff9ee2;
            font-style: italic;
            margin-top: 5px;
        }

        /* Galería Polaroid Galáctica */
        .gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .polaroid {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 10px 22px 10px;
            border-radius: 8px;
            width: 150px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transform: rotate(-3deg);
            transition: all 0.4s ease;
        }

        .polaroid:nth-child(even) {
            transform: rotate(4deg);
        }

        .polaroid:hover {
            transform: scale(1.1) rotate(0deg);
            z-index: 10;
            box-shadow: 0 0 25px rgba(255, 230, 0, 0.8);
        }

        .polaroid img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 4px;
        }

        .polaroid span {
            display: block;
            margin-top: 8px;
            font-size: 0.85rem;
            color: #111;
            font-weight: 600;
        }

        .btn-cosmico {
            background: linear-gradient(45deg, #FF0080, #7928CA);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 128,5);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-cosmico:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 0, 128, 0.8);
        }

        #mensaje-cumple {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 0, 128, 0.15);
            border-radius: 15px;
            border: 1px solid rgba(255, 113, 206, 0.4);
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Canvas para la galaxia de fondo -->
    <canvas id="galaxy-canvas"></canvas>

    <!-- Contenido de Cumpleaños -->
    <div class="content">
        <div class="glass-card">
            <h1>¡Feliz Cumpleaños, Mi Amor! 🎂✨</h1>
            <p>Hoy el universo está de fiesta porque cumple años la persona más maravillosa que ilumina todos mis días.</p>
            
            <div class="gallery">
                <div class="polaroid">
                    <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=400" alt="Pastel">
                    <span>¡Feliz día! 🎈</span>
                </div>
                <div class="polaroid">
                    <img src="https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=400" alt="Celebración">
                    <span>Te amo 💖</span>
                </div>
            </div>

            <button class="btn-cosmico" onclick="mostrarMensajeAleatorio()">Descubre tu deseo 🌠</button>

            <div id="mensaje-cumple">
                <p class="subtext" id="texto-mensaje">Haz clic en el botón para leer una sorpresa...</p>
            </div>
        </div>
    </div>

    <!-- Script de Animación Galáctica y Mensajes Románticos -->
    <script>
        const canvas = document.getElementById('galaxy-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Crear partículas estelares
        const numParticles = 900;
        const particles = [];
        const colors = ['#ff71ce', '#ffe600', '#01cdfe', '#05ffa1', '#b967ff', '#fff'];

        for (let i = 0; i < numParticles; i++) {
            particles.push({
                x: (Math.random() - 0.5) * width * 2,
                y: (Math.random() - 0.5) * height * 2,
                z: Math.random() * width,
                radius: Math.random() * 2.2 + 0.5,
                color: colors[Math.floor(Math.random() * colors.length)]
            });
        }

        function render() {
            ctx.fillStyle = 'rgba(2, 2, 8, 0.2)';
            ctx.fillRect(0, 0, width, height);

            const cx = width / 2;
            const cy = height / 2;

            particles.forEach(p => {
                p.z -= 0.8;

                if (p.z <= 0) {
                    p.z = width;
                    p.x = (Math.random() - 0.5) * width * 2;
                    p.y = (Math.random() - 0.5) * height * 2;
                }

                const k = 250 / p.z;
                const px = p.x * k + cx;
                const py = p.y * k + cy;

                if (px >= 0 && px <= width && py >= 0 && py <= height) {
                    const alpha = (1 - p.z / width);
                    ctx.beginPath();
                    ctx.arc(px, py, p.radius * k, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = alpha;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = p.color;
                    ctx.fill();
                }
            });

            requestAnimationFrame(render);
        }

        render();

        // Lista de mensajes románticos de cumpleaños
        const mensajesCumple = [
            "\"Deseo que este nuevo año de vida te traiga tanta felicidad como la que tú le regalas a mi vida todos los días. ¡Que cumplas muchos más a mi lado! Te amo con el alma.\" 🥂❤️",
            "\"Verte sonreír es mi regalo favorito, pero hoy el regalo es para el mundo por tenerte. ¡Feliz cumpleaños al amor de mi vida! ✨\"",
            "\"Que cada estrella de esta galaxia te guarde y te cuide en este nuevo año. Gracias por ser mi compañera de aventuras y mi paz. 🌌💖\"",
            "\"Brindo por ti, por tus sueños, por tus risas y por todos los años que nos faltan por celebrar juntos. ¡Te amo muchísimo! 🎂🎉\"",
            "\"Eres la casualidad más hermosa de mi universo. Que este cumpleaños esté lleno de momentos mágicos y mucho amor. 💫💘\""
        ];

        function mostrarMensajeAleatorio() {
            const contenedor = document.getElementById('mensaje-cumple');
            const texto = document.getElementById('texto-mensaje');
            
            // Elegir un mensaje al azar
            const randomMsg = mensajesCumple[Math.floor(Math.random() * mensajesCumple.length)];
            
            texto.innerHTML = randomMsg;
            contenedor.style.display = 'block';
        }
    </script>
</body>
</html>
